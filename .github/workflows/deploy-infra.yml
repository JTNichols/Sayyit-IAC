# The script to create the GH OIDC credential must be run one time prior to this
# CreateEntraApp-ServPrinc-GhFedCred.ps1 -Repo "JTNichols/sayyit-iac" -EnvironmentName "dev" -ResourceGroupName "sayyit_rg1"
 
name: Deploy Sayyit Infrastructure

on:
  push:
    branches: [ env/dev ]
    paths:
      - 'main.bicep'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: sayyit_rg1
  ENV_NAME: dev
  BASE_NAME: sayyit
  WEBAPP_NAME: sayyit-dev-web
  KEYVAULT_NAME: sayyit-dev-kv
  PUBLISH_PROFILE_SECRET_NAME: sayyit-dev-web-publish-profile

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Check Azure secrets presence
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" && echo "CLIENT_ID set" || echo "CLIENT_ID missing"
          test -n "${{ secrets.AZURE_TENANT_ID }}" && echo "TENANT_ID set" || echo "TENANT_ID missing"
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" && echo "SUBSCRIPTION_ID set" || echo "SUBSCRIPTION_ID missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure context
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az account show
            
# Only required once:
      # - name: Set up GitHub OIDC identity
      #   shell: pwsh
      #   run: |
      #     ./Scripts/CreateEntraApp-ServPrinc-GhFedCred.ps1 `
      #       -Repo "JTNichols/sayyit-iac" `
      #       -EnvironmentName "dev" `
      #       -ResourceGroupName "sayyit_rg1"

      - name: Ensure required resource providers are registered
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az provider register --namespace Microsoft.KeyVault --wait
            az provider register --namespace Microsoft.Web --wait

      - name: Lint Bicep
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az bicep install
            az bicep lint --file ./main.bicep

      - name: Deploy infrastructure
        uses: azure/CLI@v2
        with:
          inlineScript: |
            DEPLOYMENT_PRINCIPAL_OBJECT_ID=$(az ad sp show \
              --id "${{ secrets.AZURE_CLIENT_ID }}" \
              --query id -o tsv)

            az deployment group create \
              --resource-group $RESOURCE_GROUP \
              --template-file ./main.bicep \
              --parameters env=$ENV_NAME \
                           baseName=$BASE_NAME \
                           deploymentPrincipalObjectId=$DEPLOYMENT_PRINCIPAL_OBJECT_ID
                
      - name: Save web app publish profile to Key Vault
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment list-publishing-profiles \
              --resource-group $RESOURCE_GROUP \
              --name $WEBAPP_NAME \
              --xml \
              --output tsv > publish-profile.xml

            test -s publish-profile.xml

            az keyvault secret set \
              --vault-name $KEYVAULT_NAME \
              --name $PUBLISH_PROFILE_SECRET_NAME \
              --file publish-profile.xml