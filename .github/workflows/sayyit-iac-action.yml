name: Deploy Sayyit Infrastructure

on:
  push:
    branches: [ env/dev, main ]
    paths:
      - 'main.dev.bicep'
      - '.github/workflows/sayyit-iac-action.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: sayyit_rg1
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  BASE_NAME: sayyit
  GENERATE_SQL_PASSWORD: true
  MODIFY_EXTERNAL_ID_TENANT: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Check Azure secrets presence
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" && echo "CLIENT_ID set" || echo "CLIENT_ID missing"
          test -n "${{ secrets.AZURE_TENANT_ID }}" && echo "TENANT_ID set" || echo "TENANT_ID missing"
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" && echo "SUBSCRIPTION_ID set" || echo "SUBSCRIPTION_ID missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure context
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az account show

      - name: Ensure required resource providers are registered
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az provider register --namespace Microsoft.KeyVault --wait
            az provider register --namespace Microsoft.Web --wait

      - name: Lint Bicep
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az bicep install
            az bicep lint --file ./main.dev.bicep

      - name: Generate SQL password
        if: ${{ env.GENERATE_SQL_PASSWORD == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import string

          lower = string.ascii_lowercase
          upper = string.ascii_uppercase
          digits = string.digits
          special = '!@#$%^&*()-_=+'

          password = [
              secrets.choice(lower),
              secrets.choice(upper),
              secrets.choice(digits),
              secrets.choice(special),
            ]

          alphabet = lower + upper + digits + special
          password.extend(secrets.choice(alphabet) for _ in range(20))
          secrets.SystemRandom().shuffle(password)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('sqlServerPassword=' + ''.join(password) + '\n')
          PY

      - name: Deploy infrastructure
        uses: azure/CLI@v2
        with:
          inlineScript: |
            DEPLOYMENT_PRINCIPAL_OBJECT_ID=$(az ad sp show \
              --id "${{ secrets.AZURE_CLIENT_ID }}" \
              --query id -o tsv)

            az deployment group create \
              --resource-group $RESOURCE_GROUP \
              --template-file ./main.${ENV_NAME}.bicep \
              --parameters env=$ENV_NAME \
                           baseName=$BASE_NAME \
                           deploymentPrincipalObjectId=$DEPLOYMENT_PRINCIPAL_OBJECT_ID \
                           sqlServerAdministratorPassword=$sqlServerPassword \
                           modifyExternalIdTenant=$MODIFY_EXTERNAL_ID_TENANT \
                           updatePassword=$GENERATE_SQL_PASSWORD